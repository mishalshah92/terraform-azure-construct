version: "3.9"
services:
  grafana:
    container_name: grafana
    image: ${acr_login_server}.azurecr.io/grafana-azure:${grafana_tag}
    restart: always
    user: "0"
    labels:
      service: grafana
    volumes:
      - ${grafana_data_path}/var/lib/grafana:/var/lib/grafana
      - grafana_log_vol:/var/log/grafana
    environment:
      - GF_SERVER_ROOT_URL=${grafana_server_root_url}
      - GF_INSTANCE_NAME=${app_customer}-${app_env}-${app_deployment}
      - GF_SECURITY_ADMIN_USER=${gf_security_admin_user}
      - GF_SECURITY_ADMIN_PASSWORD=${gf_security_admin_password}
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      - GF_LOG_MODE=console
      - GF_LOG_CONSOLE_LEVEL=info
      - GF_LOG_CONSOLE_FORMAT=json
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=${grafana_db_host}
      - GF_DATABASE_NAME=${grafana_db_name}
      - GF_DATABASE_USER=${grafana_db_user}
      - GF_DATABASE_PASSWORD=${grafana_db_password}
      - GF_DATABASE_SSL_MODE=require
      - GF_DASHBOARDS_VERSIONS_TO_KEEP=10
      - GF_AZURE_CLOUD=AzureCloud
      - GF_AZURE_MANAGED_IDENTITY_ENABLED=true
      - GF_AZURE_MANAGED_IDENTITY_CLIENT_ID=${grafana_azure_managed_identity_client_id}
      - GF_AUTH_AZUREAD_NAME=Azure AD
      - GF_AUTH_AZUREAD_ENABLED=true
      - GF_AUTH_AZUREAD_ALLOW_SIGN_UP=true
      - GF_AUTH_AZUREAD_CLIENT_ID=${grafana_auth_azuread_client_id}
      - GF_AUTH_AZUREAD_CLIENT_SECRET=${grafana_auth_azuread_client_secret}
      - GF_AUTH_AZUREAD_AUTH_URL=https://login.microsoftonline.com/${grafana_auth_azuread_tenant_id}/oauth2/v2.0/authorize
      - GF_AUTH_AZUREAD_TOKEN_URL=https://login.microsoftonline.com/${grafana_auth_azuread_tenant_id}/oauth2/v2.0/token
      - GF_EXTERNAL_IMAGE_STORAGE_AZURE_BLOB_ACCOUNT_NAME=${gf_external_image_storage_azure_blob_account_name}
      - GF_EXTERNAL_IMAGE_STORAGE_AZURE_BLOB_ACCOUNT_KEY=${gf_external_image_storage_azure_blob_account_key}
      - GF_EXTERNAL_IMAGE_STORAGE_AZURE_BLOB_ACCOUNT_CONTAINER_NAME=${gf_external_image_storage_azure_blob_account_container_name}
    ports:
      - ${grafana_port}:3000

  filebeat:
    container_name: filebeat
    image: ${acr_login_server}.azurecr.io/filebeat:${filebeat_tag}
    user: root
    restart: always
    labels:
      service: filebeat 
    volumes:
      - filebeat_vol:/var/log
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/cloud-init-output.log:/var/log/hostlogs/cloud-init/cloud-init-output.log
    environment:
      - ES_HOSTS=${es_hosts}
      - ES_USERNAME=${es_username}
      - ES_PASSWORD=${es_password}
      - APP_CUSTOMER=${app_customer}
      - APP_OWNER=${app_owner}
      - APP_EMAIL=${app_email}
      - APP_ENV=${app_env}
      - APP_DEPLOYMENT=${app_deployment}
      - APP_REPO=${app_repo}
      - APP_MODULE=${app_module}
      - APP_RESOURCE_GROUP=${app_resource_group}

volumes:
  grafana_log_vol:
    driver: local
  filebeat_vol:
    driver: local